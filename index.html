<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geocaching Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #cache-list-toggle {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 900;
            border: none;
            border-radius: 999px;
            background: #fff;
            color: #1f2937;
            padding: 0.65rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #cache-list-panel {
            position: fixed;
            top: 4rem;
            left: 1rem;
            width: min(85vw, 320px);
            max-height: calc(100vh - 5rem);
            z-index: 900;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #cache-list-panel.hidden {
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
        }

        .cache-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            border-bottom: 1px solid #e5e7eb;
            background: #f8fafc;
            padding-right: 0.6rem;
        }

        .cache-list-title {
            padding: 0.8rem 0.9rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #334155;
        }

        #cache-sort-toggle {
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #1e293b;
            border-radius: 999px;
            padding: 0.35rem 0.65rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        #cache-list {
            list-style: none;
            overflow: auto;
        }

        .cache-list-item {
            width: 100%;
            text-align: left;
            border: 0;
            border-bottom: 1px solid #f1f5f9;
            background: transparent;
            padding: 0.75rem 0.9rem;
            font-size: 0.95rem;
            color: #0f172a;
            cursor: pointer;
        }

        .cache-list-item:active,
        .cache-list-item.active {
            background: #e2e8f0;
        }

        #compass-widget {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            z-index: 900;
            width: min(88vw, 240px);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
            border: 1px solid #e2e8f0;
            padding: 0.85rem;
            display: none;
            backdrop-filter: blur(4px);
        }

        #compass-widget.visible {
            display: block;
        }

        .compass-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            margin-bottom: 0.35rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .compass-body {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .compass-ring {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            background: linear-gradient(145deg, #f8fafc, #eef2f7);
            display: grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .compass-arrow {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #0f172a;
            transform-origin: center 65%;
            transition: transform 0.15s linear;
        }

        .compass-meta {
            min-width: 0;
        }

        #compass-distance,
        #compass-direction {
            font-size: 0.85rem;
            color: #1e293b;
            line-height: 1.35;
        }

        #permission-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #permission-overlay.visible {
            display: flex;
        }

        .permission-dialog {
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            margin: 1rem;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .permission-dialog h2 {
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
            color: #333;
        }

        .permission-dialog p {
            margin-bottom: 1.5rem;
            color: #666;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .permission-dialog button {
            background: #2196F3;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .permission-dialog button:active {
            background: #1976D2;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <button id="cache-list-toggle" type="button">Caches</button>
    <aside id="cache-list-panel" aria-label="Cache list">
        <div class="cache-list-header">
            <div class="cache-list-title">All Caches</div>
            <button id="cache-sort-toggle" type="button">Sort: A-Z</button>
        </div>
        <ul id="cache-list"></ul>
    </aside>

    <section id="compass-widget" aria-live="polite" aria-label="Direction to selected cache">
        <div class="compass-title" id="compass-target">Select a cache</div>
        <div class="compass-body">
            <div class="compass-ring" aria-hidden="true">
                <div class="compass-arrow" id="compass-arrow"></div>
            </div>
            <div class="compass-meta">
                <div id="compass-distance">Distance: --</div>
                <div id="compass-direction">Direction: --</div>
            </div>
        </div>
    </section>

    <div id="permission-overlay">
        <div class="permission-dialog">
            <h2>Location Access Required</h2>
            <p id="permission-message">
                This app needs your precise GPS location to show where you are on the map.
                Please grant location permission when prompted.
            </p>
            <button id="permission-btn">Enable Location</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        (function () {
            const coordinates = [
                [42.004533, -97.4262, "Cache 1"],
                [42.004467, -97.426033, "Cache 2"],
                [42.00435, -97.425967, "Cache 3"],
                [42.004017, -97.425783, "Cache 4"],
                [42.00405, -97.425867, "Cache 5"],
                [42.003917, -97.4255, "Cache 6"],
                [42.003783, -97.425867, "Cache 7"],
                [42.003783, -97.4256, "Cache 8"],
                [42.003517, -97.426517, "Cache 9"],
                [42.0047, -97.425183, "Cache 10"],
                [42.00495, -97.424567, "Cache 11"],
                [42.00525, -97.4249, "Cache 12"],
                [42.00545, -97.425067, "Cache 13"],
                [42.005883, -97.42485, "Cache 14"],
                [42.0062, -97.424617, "Cache 15"],
                [42.00655, -97.423983, "Cache 16"],
                [42.006267, -97.423683, "Cache 17"],
                [42.00615, -97.423933, "Cache 18"],
                [42.005667, -97.42335, "Cache 19"],
                [42.005383, -97.423817, "Cache 20"],
            ];
            // ===================================

            const map = L.map('map').setView([39.8283, -98.5795], 4);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Add coordinate pins to the map
            const pinIcon = L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
                shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });

            // Haversine formula: returns distance in miles
            function getDistanceMiles(lat1, lng1, lat2, lng2) {
                const R = 3958.8; // Earth radius in miles
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLng / 2) * Math.sin(dLng / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            function formatDistance(miles) {
                const feet = miles * 5280;
                if (feet <= 1000) {
                    return Math.round(feet) + ' ft';
                }
                return (Math.floor(miles * 100) / 100).toFixed(2) + ' mi';
            }

            function formatAccuracy(accuracyMeters) {
                const feet = accuracyMeters * 3.28084;
                return '±' + Math.round(feet) + ' ft';
            }

            const markers = [];
            coordinates.forEach(function (coord) {
                const marker = L.marker([coord[0], coord[1]], { icon: pinIcon }).addTo(map);
                marker.coordData = { lat: coord[0], lng: coord[1], label: coord[2] || '' };
                marker.bindPopup(coord[2] || '');
                markers.push(marker);
            });

            const cacheListPanel = document.getElementById('cache-list-panel');
            const cacheListEl = document.getElementById('cache-list');
            const cacheListToggleBtn = document.getElementById('cache-list-toggle');
            const cacheSortToggleBtn = document.getElementById('cache-sort-toggle');
            const compassWidget = document.getElementById('compass-widget');
            const compassTargetEl = document.getElementById('compass-target');
            const compassDistanceEl = document.getElementById('compass-distance');
            const compassDirectionEl = document.getElementById('compass-direction');
            const compassArrowEl = document.getElementById('compass-arrow');
            let activeListButton = null;
            let activeMarker = null;
            let sortMode = 'alphabetical';
            let userLat = null;
            let userLng = null;
            let deviceHeading = null;
            let compassTrackingEnabled = false;
            let smoothedHeading = null;
            let smoothedBearing = null;
            let smoothedCompassLat = null;
            let smoothedCompassLng = null;
            let lastArrowRotation = null;

            function normalizeDegrees(deg) {
                return (deg % 360 + 360) % 360;
            }

            function getSignedAngleDiff(toDeg, fromDeg) {
                return ((toDeg - fromDeg + 540) % 360) - 180;
            }

            function smoothAngle(previousDeg, nextDeg, alpha) {
                if (previousDeg === null) return normalizeDegrees(nextDeg);
                const delta = getSignedAngleDiff(nextDeg, previousDeg);
                return normalizeDegrees(previousDeg + delta * alpha);
            }

            function smoothValue(previousValue, nextValue, alpha) {
                if (previousValue === null) return nextValue;
                return previousValue + (nextValue - previousValue) * alpha;
            }

            function getBearingDegrees(lat1, lng1, lat2, lng2) {
                const phi1 = lat1 * Math.PI / 180;
                const phi2 = lat2 * Math.PI / 180;
                const lambda1 = lng1 * Math.PI / 180;
                const lambda2 = lng2 * Math.PI / 180;
                const y = Math.sin(lambda2 - lambda1) * Math.cos(phi2);
                const x = Math.cos(phi1) * Math.sin(phi2) -
                    Math.sin(phi1) * Math.cos(phi2) * Math.cos(lambda2 - lambda1);
                return normalizeDegrees(Math.atan2(y, x) * 180 / Math.PI);
            }

            function bearingToCardinal(deg) {
                const labels = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                const idx = Math.round(normalizeDegrees(deg) / 45) % 8;
                return labels[idx];
            }

            function describeTurn(relativeBearing) {
                if (relativeBearing <= 20 || relativeBearing >= 340) return 'ahead';
                if (relativeBearing < 160) return 'to your right';
                if (relativeBearing <= 200) return 'behind you';
                return 'to your left';
            }

            function updateCompass() {
                if (!activeMarker) {
                    compassWidget.classList.remove('visible');
                    return;
                }

                const target = activeMarker.coordData;
                compassTargetEl.textContent = target.label || 'Selected Cache';
                compassWidget.classList.add('visible');

                if (userLat === null || userLng === null) {
                    compassDistanceEl.textContent = 'Distance: waiting for GPS';
                    compassDirectionEl.textContent = 'Direction: --';
                    compassArrowEl.style.transform = 'rotate(0deg)';
                    return;
                }

                const miles = getDistanceMiles(userLat, userLng, target.lat, target.lng);
                const compassLat = smoothedCompassLat === null ? userLat : smoothedCompassLat;
                const compassLng = smoothedCompassLng === null ? userLng : smoothedCompassLng;
                const rawBearing = getBearingDegrees(compassLat, compassLng, target.lat, target.lng);
                smoothedBearing = smoothAngle(smoothedBearing, rawBearing, 0.22);
                const bearing = smoothedBearing;
                compassDistanceEl.textContent = 'Distance: ' + formatDistance(miles);

                let arrowRotation = bearing;
                if (smoothedHeading !== null) {
                    const relative = normalizeDegrees(bearing - smoothedHeading);
                    arrowRotation = relative;
                    compassDirectionEl.textContent =
                        'Direction: ' + Math.round(relative) + '\u00b0 ' + describeTurn(relative);
                } else {
                    compassDirectionEl.textContent =
                        'Direction: ' + Math.round(bearing) + '\u00b0 ' + bearingToCardinal(bearing);
                }

                if (lastArrowRotation === null || Math.abs(getSignedAngleDiff(arrowRotation, lastArrowRotation)) >= 1.5) {
                    compassArrowEl.style.transform = 'rotate(' + arrowRotation + 'deg)';
                    lastArrowRotation = arrowRotation;
                }
            }

            function handleDeviceOrientation(event) {
                let heading = null;

                if (typeof event.webkitCompassHeading === 'number' && !Number.isNaN(event.webkitCompassHeading)) {
                    heading = event.webkitCompassHeading;
                } else if (typeof event.alpha === 'number' && !Number.isNaN(event.alpha)) {
                    heading = 360 - event.alpha;
                }

                if (heading === null) return;
                deviceHeading = normalizeDegrees(heading);
                smoothedHeading = smoothAngle(smoothedHeading, deviceHeading, 0.12);
                updateCompass();
            }

            function startCompassTracking() {
                if (compassTrackingEnabled || !window.DeviceOrientationEvent) return;
                window.addEventListener('deviceorientationabsolute', handleDeviceOrientation, true);
                window.addEventListener('deviceorientation', handleDeviceOrientation, true);
                compassTrackingEnabled = true;
            }

            function maybeEnableCompass(fromUserGesture) {
                if (!window.DeviceOrientationEvent || compassTrackingEnabled) return;
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    if (!fromUserGesture) return;
                    DeviceOrientationEvent.requestPermission()
                        .then(function (result) {
                            if (result === 'granted') {
                                startCompassTracking();
                            }
                        })
                        .catch(function () {
                            // If heading access fails, compass still works as a map-relative indicator.
                        });
                    return;
                }

                startCompassTracking();
            }

            function showCacheList() {
                cacheListPanel.classList.remove('hidden');
                cacheListToggleBtn.textContent = 'Hide Caches';
            }

            function hideCacheList() {
                cacheListPanel.classList.add('hidden');
                cacheListToggleBtn.textContent = 'Show Caches';
            }

            function selectCache(marker, shouldCloseList) {
                const latLng = marker.getLatLng();
                const zoom = Math.max(map.getZoom(), 17);
                map.setView(latLng, zoom, { animate: true });
                marker.openPopup();
                activeMarker = marker;

                if (activeListButton) {
                    activeListButton.classList.remove('active');
                }

                if (typeof marker.listButtonEl !== 'undefined') {
                    marker.listButtonEl.classList.add('active');
                    activeListButton = marker.listButtonEl;
                }

                if (shouldCloseList) {
                    hideCacheList();
                }

                updateCompass();
            }

            function updateSortToggleLabel() {
                cacheSortToggleBtn.textContent = sortMode === 'alphabetical' ? 'Sort: A-Z' : 'Sort: Nearest';
            }

            function getSortedMarkers() {
                const sorted = markers.slice();

                if (sortMode === 'nearest' && userLat !== null && userLng !== null) {
                    sorted.sort(function (a, b) {
                        const da = getDistanceMiles(userLat, userLng, a.coordData.lat, a.coordData.lng);
                        const db = getDistanceMiles(userLat, userLng, b.coordData.lat, b.coordData.lng);
                        return da - db;
                    });
                } else {
                    sorted.sort(function (a, b) {
                        return (a.coordData.label || '').localeCompare(b.coordData.label || '', undefined, {
                            numeric: true,
                            sensitivity: 'base'
                        });
                    });
                }

                return sorted;
            }

            function populateCacheList() {
                cacheListEl.innerHTML = '';
                const sortedMarkers = getSortedMarkers();

                sortedMarkers.forEach(function (marker, index) {
                    const item = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'cache-list-item';
                    btn.textContent = marker.coordData.label || 'Cache ' + (index + 1);
                    btn.addEventListener('click', function () {
                        selectCache(marker, true);
                    });

                    marker.listButtonEl = btn;

                    if (activeMarker === marker) {
                        btn.classList.add('active');
                        activeListButton = btn;
                    }

                    item.appendChild(btn);
                    cacheListEl.appendChild(item);
                });
            }

            cacheListToggleBtn.addEventListener('click', function () {
                if (cacheListPanel.classList.contains('hidden')) {
                    showCacheList();
                } else {
                    hideCacheList();
                }
            });

            cacheSortToggleBtn.addEventListener('click', function () {
                sortMode = sortMode === 'alphabetical' ? 'nearest' : 'alphabetical';
                updateSortToggleLabel();
                populateCacheList();
            });

            markers.forEach(function (marker) {
                marker.on('click', function () {
                    selectCache(marker, false);
                });
            });

            updateSortToggleLabel();
            populateCacheList();
            showCacheList();

            // Fit map to markers if any exist
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.2));
            }

            function updateMarkerPopups() {
                if (userLat === null) return;
                markers.forEach(function (marker) {
                    const d = marker.coordData;
                    const miles = getDistanceMiles(userLat, userLng, d.lat, d.lng);
                    const distText = formatDistance(miles);
                    const content = '<strong>' + d.label + '</strong><br>Distance: ' + distText;
                    marker.setPopupContent(content);
                });
            }

            // User location marker (blue circle)
            let userMarker = null;
            let userCircle = null;

            function showUserLocation(lat, lng, accuracy) {
                userLat = lat;
                userLng = lng;
                // Damp noisy GPS jitter so bearing changes remain stable while walking.
                smoothedCompassLat = smoothValue(smoothedCompassLat, lat, 0.16);
                smoothedCompassLng = smoothValue(smoothedCompassLng, lng, 0.16);
                updateMarkerPopups();
                updateCompass();
                if (sortMode === 'nearest') {
                    populateCacheList();
                }
                const userPopupContent = '<strong>Your Current Position</strong><br>Accuracy: ' + formatAccuracy(accuracy);
                if (userMarker) {
                    userMarker.setLatLng([lat, lng]);
                    userMarker.setPopupContent(userPopupContent);
                    userCircle.setLatLng([lat, lng]);
                    userCircle.setRadius(accuracy);
                } else {
                    userMarker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: '#4285F4',
                        fillOpacity: 1,
                        color: '#fff',
                        weight: 3
                    }).addTo(map);
                    userMarker.bindPopup(userPopupContent);

                    userCircle = L.circle([lat, lng], {
                        radius: accuracy,
                        fillColor: '#4285F4',
                        fillOpacity: 0.1,
                        color: '#4285F4',
                        weight: 1
                    }).addTo(map);

                    // If no coordinate markers, center on user
                    if (markers.length === 0) {
                        map.setView([lat, lng], 15);
                    }
                }
            }

            // Permission handling
            const overlay = document.getElementById('permission-overlay');
            const message = document.getElementById('permission-message');
            const btn = document.getElementById('permission-btn');

            function showPermissionOverlay(msg) {
                message.textContent = msg;
                overlay.classList.add('visible');
            }

            function hidePermissionOverlay() {
                overlay.classList.remove('visible');
            }

            function requestLocation(fromUserGesture) {
                hidePermissionOverlay();
                maybeEnableCompass(Boolean(fromUserGesture));

                if (!navigator.geolocation) {
                    showPermissionOverlay(
                        'Geolocation is not supported by your browser. Please use a modern mobile browser.'
                    );
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        showUserLocation(
                            position.coords.latitude,
                            position.coords.longitude,
                            position.coords.accuracy
                        );
                        // Watch for location updates
                        startWatching();
                    },
                    function (error) {
                        let msg;
                        switch (error.code) {
                            case error.PERMISSION_DENIED:
                                msg = 'Location permission was denied. Please tap the button below and grant precise location access when prompted. On some devices, you may need to enable location in your browser or device settings.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                msg = 'Your location could not be determined. Please ensure GPS is enabled on your device and try again.';
                                break;
                            case error.TIMEOUT:
                                msg = 'Location request timed out. Please ensure you are in an area with GPS signal and try again.';
                                break;
                            default:
                                msg = 'An unknown error occurred while requesting your location. Please try again.';
                        }
                        showPermissionOverlay(msg);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            }

            let watchId = null;

            function startWatching() {
                if (watchId !== null) return;
                watchId = navigator.geolocation.watchPosition(
                    function (position) {
                        showUserLocation(
                            position.coords.latitude,
                            position.coords.longitude,
                            position.coords.accuracy
                        );
                    },
                    function () {
                        // Silently ignore watch errors
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 5000
                    }
                );
            }

            btn.addEventListener('click', function () {
                requestLocation(true);
            });

            // Request location on load
            requestLocation(false);
        })();
    </script>
</body>

</html>
